<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Path AR</title>
  <meta name="description" content="Satélites, missões e exploração espacial — material de apoio a aulas. Globo interativo com bases de lançamento.">
  <meta name="color-scheme" content="dark">

  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">

  <script type="module" src="/src/globo.js"></script>

  <!-- Guarda de último recurso, em script CLÁSSICO de propósito: se o módulo
       acima falhar ao ser avaliado (import errado, rede, CDN fora do ar), ele
       nunca roda, e nenhum tratamento de erro escrito lá dentro chega a
       existir. A página ficaria preta e muda.

       O sinal observado é o DOM, não uma variável combinada: o MapLibre cria
       um <canvas> dentro do contêiner. Sem canvas depois de 12 segundos,
       alguma coisa falhou — não importa qual. -->
  <script>
    setTimeout(function () {
      var area = document.querySelector("#globo");
      var estado = document.querySelector("#estado");
      if (!area || area.querySelector("canvas") || !estado.hidden) return;
      estado.textContent =
        "Não foi possível carregar o globo. As páginas dos satélites " +
        "continuam acessíveis pelos QR Codes do material impresso.";
      estado.className = "estado estado--erro";
      estado.hidden = false;
    }, 12000);
  </script>

  <noscript>
    <style>
      /* Sem JavaScript o globo nunca é criado: esconder a área evita um
         retângulo vazio ocupando a tela inteira. O campo de estrelas vive
         no fundo deste mesmo elemento (ver styles.css), então some junto. */
      .globo-area { display: none; }
    </style>
  </noscript>
</head>

<body class="pagina-globo">
  <!-- O cabeçalho fica SOBRE o globo, não acima dele: numa tela de celular,
       cada pixel gasto com moldura é pixel a menos de planeta. -->
  <header class="cabecalho-globo">
    <h1>Web Path AR</h1>
    <p>Bases de lançamento e locais de atividade</p>
  </header>

  <div class="globo-area" id="globo"></div>

  <p class="estado" id="estado" role="status" aria-live="polite" hidden></p>

  <noscript>
    <p class="estado estado--aviso">
      O globo interativo precisa de JavaScript. As páginas dos satélites
      continuam acessíveis pelos QR Codes do material impresso.
    </p>
  </noscript>
</body>
</html>
