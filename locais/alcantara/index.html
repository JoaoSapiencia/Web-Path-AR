  <link rel="stylesheet" href="/src/styles.css">

<body data-slug="alcantara">

         conferida por tools/validar.py (ADR-009). -->

      <p class="estado estado--aviso">
        Esta página precisa de JavaScript para exibir a ficha e o conteúdo

    <p class="estado" id="erro" role="status" aria-live="polite" hidden></p>
