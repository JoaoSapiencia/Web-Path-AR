<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CubeSat 1U — Teste de escala AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@^3.5.0/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05070d;
      color: #e8eaf0;
      font-family: system-ui, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
    }
    .escala-nota {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="escala-nota">
    Teste piloto — scale="0.048" (hipótese: CubeSat 1U real = 10 cm de lado)
  </div>
  <model-viewer
    src="/assets/models/cubesat/CubeSat%20-%201%20RU%20Generic.glb"
    alt="Modelo 3D de um CubeSat 1U genérico"
    scale="0.048 0.048 0.048"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    camera-controls
    shadow-intensity="1"
  ></model-viewer>
</body>
</html>
