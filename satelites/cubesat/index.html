<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CubeSat 1U — Web Path AR</title>
  <meta name="description" content="Um satélite do tamanho de um cubo de 10 centímetros. O padrão que tornou o espaço acessível a universidades e escolas.">
  <meta name="color-scheme" content="dark">

  <link rel="stylesheet" href="/src/styles.css">

  <!-- Versão exata, não faixa (^3.5.0): a biblioteca não deve mudar sozinha
       entre uma aula e outra. Medido em 2026-08-31: 246 KB transferidos. -->
  <script type="module"
          src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <script type="module" src="/src/satelite-page.js"></script>

  <noscript>
    <style>
      /* Sem JavaScript nada é inserido no visor: esconder evita uma caixa
         preta muda e uma legenda mandando arrastar algo que não existe. */
      .visor,
      .visor-legenda { display: none; }
    </style>
  </noscript>
</head>

<body data-slug="cubesat">
  <main class="pagina">
    <a class="voltar" href="/">&larr; Início</a>

    <!-- Título e resumo são estáticos: aparecem antes de qualquer JavaScript
         rodar e sobrevivem a uma falha de rede no fetch. O texto canônico
         vive em data/satelites/cubesat.json; esta é uma cópia deliberada. -->
    <h1>CubeSat 1U</h1>
    <p class="resumo">
      Um satélite do tamanho de um cubo de 10 centímetros. O padrão que
      tornou o espaço acessível a universidades e escolas.
    </p>

    <noscript>
      <p class="estado estado--aviso">
        Esta página precisa de JavaScript para exibir o modelo 3D e o
        conteúdo completo. O texto acima continua legível.
      </p>
    </noscript>

    <!-- O <model-viewer> é inserido aqui pelo JavaScript. A caixa já ocupa
         o espaço via aspect-ratio no CSS, então o texto abaixo não salta
         quando o modelo aparece. -->
    <div class="visor" id="visor"></div>
    <p class="visor-legenda">
      Arraste para girar. Modelo: NASA 3D Resources.
    </p>

    <p class="estado" id="erro" role="status" aria-live="polite" hidden></p>

    <dl class="ficha" id="ficha"></dl>

    <div id="secoes"></div>
  </main>
</body>
</html>
